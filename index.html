<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Арена Live</title>
<meta name="description" content="Виджет спортивных событий на реальных данных, собранный на дизайн-системе Арены.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b9ee3a'/%3E%3Cpath d='M9 22 16 9l7 13' fill='none' stroke='%230b0e13' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem("arena-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <a class="brand" href="./" aria-label="Арена Live">
    <span class="brand__mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 32 32"><path d="M9 22 16 9l7 13" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span>Арена <b>Live</b></span>
  </a>
  <div class="top__src" id="src" role="status" aria-live="polite"></div>
  <div class="top__actions">
    <a class="btn btn--ghost" href="system.html">Дизайн-система</a>
    <button class="btn btn--ghost" id="qa-toggle" aria-expanded="false" aria-controls="qa">Состояния</button>
    <button class="iconbtn" id="theme" aria-label="Сменить тему"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<section class="qa" id="qa" hidden>
  <div class="qa__in">
    <div>
      <div class="overline">Проверка состояний</div>
      <p class="qa__hint">Переключатель подменяет ответы API, чтобы показать, как интерфейс ведёт себя в нештатных ситуациях.</p>
    </div>
    <div class="seg" role="radiogroup" aria-label="Симуляция" id="qa-seg"></div>
  </div>
</section>

<div class="layout">
  <nav class="side" aria-label="Виды спорта">
    <div class="overline side__h">Спорт</div>
    <ul class="sports" id="sports"></ul>
  </nav>

  <main class="main" id="main">
    <div class="toolbar">
      <div class="days" role="tablist" aria-label="День" id="days"></div>
      <div class="seg seg--status" role="radiogroup" aria-label="Статус" id="status"></div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Команда или лига" autocomplete="off">
      </label>
    </div>
    <div id="banner"></div>
    <div id="list" class="list" aria-busy="true"></div>
  </main>

  <aside class="slip" id="slip" aria-label="Купон"></aside>
</div>

<button class="slipbar" id="slipbar" hidden></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
