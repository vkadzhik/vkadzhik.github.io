name: Fetch files
on:
  push:
    branches: [fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p fetched
          while read name url; do
            [ -z "$name" ] && continue
            [ -f "fetched/$name" ] || curl -sfL -A "Mozilla/5.0" -o "fetched/$name" "$url" || echo "fail $name"
          done < urls.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fetched
          git diff --cached --quiet || (git commit -m "Fetched files" && git push)
