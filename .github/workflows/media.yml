name: Mirror media
on:
  push:
    paths: ["_build/content.py", "_build/build.py", "_build/fetch_media.py", ".github/workflows/media.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pillow
      - run: python _build/fetch_media.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          git diff --cached --quiet || (git commit -m "Mirror media from CDN" && git push)
